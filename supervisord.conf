[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0

[program:laravel-scheduler]
command=php /app/artisan schedule:work
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:laravel-worker-fast]
command=php artisan queue:work --queue=default --tries=3 --timeout=60
autostart=true
autorestart=true
numprocs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:laravel-worker-heavy]
command=php artisan queue:work --queue=random-categories,random-brands,random-products,random-prices,random-stock,random-users,random-branches --tries=1 --timeout=600 --max-jobs=20
autostart=true
autorestart=true
numprocs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
