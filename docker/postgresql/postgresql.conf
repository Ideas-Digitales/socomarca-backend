# Logging de queries para desarrollo.
# Montado desde compose.yml. No usar este archivo en producción.
# Incluye la configuración generada por initdb (listen_addresses, etc.).
include '/var/lib/postgresql/18/docker/postgresql.conf'

log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'debug.log'
log_file_mode = 0644
log_rotation_age = 0
log_rotation_size = 0
log_truncate_on_rotation = off

log_statement = 'all'
log_duration = on
log_line_prefix = '%t [%p] (%a): '
