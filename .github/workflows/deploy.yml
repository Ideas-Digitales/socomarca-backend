name: Deployment

on:
  push:
    branches: [ "qa", "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'QA' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set environment variables
      run: |
        echo "repo_name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
        echo "IMAGE_TAG=${{ github.ref == 'refs/heads/main' && 'prod' || 'qa' }}" >> $GITHUB_ENV

    - name: Build and push image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile.deploy
        push: true
        tags: ghcr.io/${{ env.repo_name }}:${{ env.IMAGE_TAG }}
        # cache-from: type=gha
        # cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'qa' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set environment variables
      run: |
        echo "repo_name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
        echo "IMAGE_TAG=${{ github.ref == 'refs/heads/main' && 'prod' || 'qa' }}" >> $GITHUB_ENV

    # 🔐 SSH
    - name: Test SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

        ssh -vvv -i ~/.ssh/id_ed25519 \
          -o IdentitiesOnly=yes \
          -o StrictHostKeyChecking=no \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo OK"

    # 📦 Build .env dynamically
    - name: Generate .env
      env:
        SECRETS_CONTEXT: ${{ toJson(secrets) }}
        VARS_CONTEXT: ${{ toJson(vars) }}
      run: |
        python3 -c '
        import os, json

        # Get every GitHub secret and variable
        secrets = json.loads(os.environ.get("SECRETS_CONTEXT", "{}"))
        variables = json.loads(os.environ.get("VARS_CONTEXT", "{}"))

        # Merge both dicts (secrets win on collisions)
        combined = {**variables, **secrets}

        # Keys that must never end up in .env (they are materialized as a file)
        excluded = {"FIREBASE_CREDENTIALS_JSON"}

        # Read the .env.example file from the repository
        try:
            with open(".env.example", "r") as f:
                lines = f.readlines()
        except FileNotFoundError:
            print("Error: .env.example no encontrado.")
            exit(1)

        # Write the final .env file
        with open(".env", "w") as out:
            for line in lines:
                line_stripped = line.strip()
                # Keep blank lines and comments as-is
                if not line_stripped or line_stripped.startswith("#"):
                    out.write(line)
                    continue

                # Extract the key (e.g. APP_NAME=...)
                key = line_stripped.split("=")[0].strip()

                # Skip keys excluded from .env
                if key in excluded:
                    continue

                # If the key exists in GitHub (secrets or vars), write its value
                if key in combined:
                    val = str(combined[key]).replace("\"", "\\\"")
                    out.write(f"{key}=\"{val}\"\n")
                else:
                    # Otherwise keep the default value that came from .env.example
                    out.write(line)
        '

    # 🔥 Generate the Firebase credentials file
    - name: Generate Firebase credentials file
      env:
        FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
      run: |
        if [ -z "$FIREBASE_CREDENTIALS_JSON" ]; then
          echo "::error::FIREBASE_CREDENTIALS_JSON no está definido en los secretos."
          exit 1
        fi

        # Target path declared in FIREBASE_CREDENTIALS (relative to /app inside the container)
        CRED_PATH=$(grep -m1 -E '^FIREBASE_CREDENTIALS=' .env | cut -d= -f2- | tr -d '"' | tr -d "'")
        if [ -z "$CRED_PATH" ]; then
          echo "::error::FIREBASE_CREDENTIALS no está definido en el .env generado."
          exit 1
        fi
        echo "FIREBASE_CREDENTIALS_PATH=${CRED_PATH#/}" >> $GITHUB_ENV

        # Write the JSON verbatim (no wrapping quotes) and validate it
        printf '%s' "$FIREBASE_CREDENTIALS_JSON" > firebase-credentials.json
        python3 -c 'import json; json.load(open("firebase-credentials.json"))' || {
          echo "::error::FIREBASE_CREDENTIALS_JSON no contiene un JSON válido."
          exit 1
        }
        chmod 600 firebase-credentials.json
        echo "✅ Credenciales válidas, se instalarán en /app/${CRED_PATH#/}"

    # 📤 Upload files
    - name: Upload files
      run: |
        export REPO_NAME=${{ env.repo_name }}
        export IMAGE_TAG=${{ env.IMAGE_TAG }}
        export APP_HOST=$(echo "${{ vars.APP_URL }}" | sed -e 's|^[^/]*//||' -e 's|/.*$||')

        envsubst '${REPO_NAME} ${IMAGE_TAG} ${APP_HOST}' < compose.deploy.yml > compose.tmp.yml

        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p ${{ vars.BASE_DIR }}"

        scp compose.tmp.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.BASE_DIR }}/compose.yml
        scp .env ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.BASE_DIR }}/.env
        scp supervisord.conf ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.BASE_DIR }}/supervisord.conf
        scp firebase-credentials.json ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.BASE_DIR }}/firebase-credentials.json

    # 📥 Pull + deploy with no downtime
    - name: Clean and deploy containers
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
        set -e
        cd ${{ vars.BASE_DIR }}

        echo "🔐 Login GHCR..."
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

        echo "📥 Pull image..."
        docker pull ghcr.io/${{ env.repo_name }}:${{ env.IMAGE_TAG }}

        echo "🛑 Stopping worker container"
        docker compose down worker

        echo "✨ Starting app container"
        docker compose up app -d --remove-orphans

        echo "🔥 Installing Firebase credentials"
        docker compose exec -T app mkdir -p "$(dirname /app/${{ env.FIREBASE_CREDENTIALS_PATH }})" < /dev/null
        docker compose cp firebase-credentials.json app:/app/${{ env.FIREBASE_CREDENTIALS_PATH }}
        docker compose exec -T app chmod 600 /app/${{ env.FIREBASE_CREDENTIALS_PATH }} < /dev/null
        rm -f firebase-credentials.json

        echo "⚙️ Running migrations"
        docker compose exec -T app php artisan migrate --force --seed < /dev/null

        echo "⚡ Optimizing Laravel"
        docker compose exec -T app php artisan optimize < /dev/null

        echo "♻️ Starting worker container"
        docker compose up worker -d --remove-orphans

        echo "🧹 Removing old images..."
        docker image prune -f

        echo "📊 Containers status:"
        docker compose ps
        ENDSSH
    # ❤️ Internal health check (Docker)
    - name: Health check
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
          cd ${{ vars.BASE_DIR }}
          echo 'Verifying HTTP response (internal)...'
          docker compose exec -T app wget --spider -q http://localhost:80/up || exit 1
        "

    # 📜 Final logs
    - name: Show logs
      if: always()
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
        "cd ${{ vars.BASE_DIR }} && docker compose logs --tail=100"
