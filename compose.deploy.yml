x-awslogs-options: &awslogs-options
  awslogs-group: /socomarca/${IMAGE_TAG}
  awslogs-create-group: "true"
  # Event start: Laravel "[YYYY-MM-DD", queue:work/supervisord "YYYY-MM-DD", Caddy JSON "{"
  awslogs-multiline-pattern: '^(\[\d{4}-\d{2}-\d{2}|\s*\d{4}-\d{2}-\d{2}|\{)'
  mode: non-blocking
  max-buffer-size: 4m

services:
  app:
    image: ghcr.io/${REPO_NAME}:${IMAGE_TAG}
    container_name: socomarca_app_${IMAGE_TAG}
    restart: unless-stopped
    environment:
      - SERVER_NAME=:80
    env_file:
      - .env
    networks:
      - traefik-public
      - internal
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-stream: app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.socomarca_${IMAGE_TAG}.rule=Host(`${APP_HOST}`)"
      - "traefik.http.routers.socomarca_${IMAGE_TAG}.entrypoints=websecure"
      - "traefik.http.routers.socomarca_${IMAGE_TAG}.tls.certresolver=myresolver"
      - "traefik.http.services.socomarca_${IMAGE_TAG}.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik-public"
    volumes:
      - firebase_credentials_storage:/app/storage/app/private/firebase
      - log_storage:/app/storage/logs

  worker:
    image: ghcr.io/${REPO_NAME}:${IMAGE_TAG}
    container_name: socomarca_worker_${IMAGE_TAG}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    command: ["/usr/bin/supervisord", "-c", "/app/supervisord.conf"]
    env_file:
      - .env

    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-stream: worker
    networks:
      - internal
    volumes:
      - firebase_credentials_storage:/app/storage/app/private/firebase
      - log_storage:/app/storage/logs
      - ./supervisord.conf:/app/supervisord.conf:ro

  # QA only. Production never enables the "qa" profile, so this service is not started there.
  mailpit:
    profiles: ["qa"]
    image: axllent/mailpit:v1.31.6
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
    environment:
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:-}
      MP_ALLOWED_HOSTS: ${MAILPIT_HOST:-}
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
      # Laravel may send MAIL_USERNAME / MAIL_PASSWORD over plaintext SMTP.
      # The port is limited to the internal network and 127.0.0.1.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.mailpit.rule=Host(`${MAILPIT_HOST:-}`)"
      - "traefik.http.routers.mailpit.entrypoints=websecure"
      - "traefik.http.routers.mailpit.tls.certresolver=myresolver"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"
    networks:
      - traefik-public
      - internal
    volumes:
      - mailpit_data:/data

networks:
  traefik-public:
    external: true

  internal:
    driver: bridge

volumes:
  firebase_credentials_storage:
    name: firebase_credentials_${IMAGE_TAG}
  log_storage:
    name: socomarca_logs_${IMAGE_TAG}
  mailpit_data:
    name: mailpit_data_qa
